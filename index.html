<!DOCTYPE html>
<html>
<body>

<h1>Direkter WOL-Test</h1>

<button onclick="test()">
Start
</button>

<pre id="out"></pre>

<script>

async function test(){

    const out =
    document.getElementById("out");

    out.textContent =
    "Start";

    try{

        const r =
        await fetch(
          "https://wol.jw.org/en/wol/meetings/r1/lp-e/2026/42"
        );

        out.textContent =
        "STATUS: "
        + r.status;

    }

    catch(e){

        out.textContent =
        e.message;

    }

}

</script>

</body>
</html>
