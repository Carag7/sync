name: Lieder aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"   # täglich 03:17 UTC
  workflow_dispatch:        # manuell startbar (Actions -> Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Lieder abfragen (Option 1 und 2)
        id: normal
        continue-on-error: true
        run: python scrape_lieder.py --weeks 8

      - name: Lieder abfragen (Option 3 - Headless-Browser)
        if: steps.normal.outcome == 'failure'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_lieder.py --weeks 8 --browser

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lieder.json
          git diff --cached --quiet || (git commit -m "Lieder aktualisiert" && git push)
